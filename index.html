<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤸</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Shape Lab — free browser gymnastics shape coaching with MediaPipe Pose" />
    <title>Shape Lab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx?boot=4"></script>
    <script>
      window.setTimeout(function () {
        var root = document.getElementById('root')
        if (!root) return
        var text = root.textContent || ''
        if (text.indexOf('Loading this gym') === -1) return
        if (text.indexOf('Try again') !== -1) return
        var href = location.protocol + '//' + location.host + '/?fresh=' + Date.now()
        root.innerHTML =
          '<div style="max-width:32rem;margin:20vh auto;padding:1.25rem;font-family:system-ui;color:#e8eef4">' +
          '<div style="background:#ff6a00;color:#1a0a00;font-weight:900;padding:12px 16px;border-radius:12px;margin-bottom:1rem">ORANGE BUILD</div>' +
          '<p style="letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:#8b9bb0">Shape Lab</p>' +
          '<h1 style="font-size:1.6rem">Still loading — use a fresh copy</h1>' +
          '<p>On the Mac Terminal run <b>npm run gym:mac</b>. Then open:</p>' +
          '<p><a href="' + href + '" style="color:#7ee0c2">' + href + '</a></p>' +
          '</div>'
      }, 45000)
    </script>
  </body>
</html>
