<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤸</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Shape Lab — free browser gymnastics shape coaching with MediaPipe Pose" />
    <meta property="og:title" content="ShapeLab" />
    <meta property="og:description" content="Shape Lab coaching app: shapes, drills, progressions, and lessons." />
    <meta property="og:type" content="website" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#080d11" />
    <title>shapelab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx?boot=38"></script>
    <script>
      // If the app never paints (bundle failed, or React mounted then threw
      // and left an empty root), offer a one-tap fresh copy instead of a
      // black screen. The 10s check fires on an empty root only, boot text
      // means it is still starting. The 45s check also fires when still
      // stuck on the loading text. React mounting later replaces this card,
      // so a slow first load is safe, and the error boundary screen has
      // visible text, so this never fires over it.
      function shapelabNeedsRecovery(allowLoading) {
        var root = document.getElementById('root')
        if (!root) return false
        var text = (root.textContent || '').trim()
        if (text.indexOf('Try again') !== -1) return false
        if (text === '') return true
        return allowLoading && text.indexOf('Loading this gym') !== -1
      }
      function shapelabRecoveryCard() {
        var root = document.getElementById('root')
        if (!root) return
        var path = location.pathname + location.search
        var fresh =
          path + (path.indexOf('?') === -1 ? '?' : '&') + 'v=' + Date.now().toString(36)
        var href = location.protocol + '//' + location.host + fresh
        root.innerHTML =
          '<div style="max-width:32rem;margin:20vh auto;padding:1.25rem;font-family:system-ui;color:#e8eef4">' +
          '<div style="background:#6ec8d6;color:#061418;font-weight:900;padding:12px 16px;border-radius:12px;margin-bottom:1rem">LACE BUILD</div>' +
          '<p style="letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:#8b99a3">shapelab</p>' +
          '<h1 style="font-size:1.6rem">ShapeLab did not finish loading</h1>' +
          '<p>This screen is empty, so the app did not finish starting. Tap below for a fresh copy.</p>' +
          '<p><a href="' +
          href +
          '" style="display:inline-block;background:#6ec8d6;color:#061418;font-weight:700;padding:10px 16px;border-radius:10px;text-decoration:none">Reload a fresh copy</a></p>' +
          '</div>'
      }
      window.setTimeout(function () {
        if (shapelabNeedsRecovery(false)) shapelabRecoveryCard()
      }, 10000)
      window.setTimeout(function () {
        if (shapelabNeedsRecovery(true)) shapelabRecoveryCard()
      }, 45000)
    </script>
  </body>
</html>
